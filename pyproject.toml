[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-plugin-linguonnx"
dynamic = ["version"]
description = "OVOS language detection and translation plugins using linguonnx (ONNX, offline)"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "jarbasAi", email = "jarbasai@mailfence.com" }
]
requires-python = ">=3.8"
dependencies = [
    "linguonnx>=0.12.0a1",
    "ovos-plugin-manager>=2.1.0,<3.0.0"
]

[project.optional-dependencies]
test = ["pytest"]
# The network test loads a real model. linguonnx picks the tokenizer from
# the model it routes to, and the current gl->en route needs the OpenNMT-BPE
# tokenizer, which lives behind linguonnx's own "opennmt" extra. Without it
# the test fails on an ImportError for sacremoses before it reaches the
# network. A future route change can need a different tokenizer extra.
network = ["pytest", "linguonnx[opennmt]"]

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/ovos-plugin-linguonnx"
linguonnx = "https://github.com/OpenVoiceOS/linguonnx"

[project.entry-points."opm.lang.detect"]
ovos-lang-detect-plugin-linguonnx = "ovos_plugin_linguonnx:LinguONNXLangDetectPlugin"

[project.entry-points."opm.lang.translate"]
ovos-translate-plugin-linguonnx = "ovos_plugin_linguonnx:LinguONNXTranslatePlugin"

[tool.setuptools.dynamic]
version = { attr = "ovos_plugin_linguonnx.version.__version__" }

[tool.setuptools.packages.find]
include = ["ovos_plugin_linguonnx*"]

[tool.pytest.ini_options]
markers = ["network: downloads models from HuggingFace and runs them"]
