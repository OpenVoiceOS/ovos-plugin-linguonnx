[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-lang-detect-plugin-linguonnx"
dynamic = ["version"]
description = "OVOS language detection plugin using linguonnx (GlotLID/ONNX)"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "jarbasAi", email = "jarbasai@mailfence.com" }
]
requires-python = ">=3.8"
dependencies = [
    "linguonnx",
    "ovos-plugin-manager>=2.1.0,<3.0.0"
]

[project.optional-dependencies]
test = ["pytest"]

[project.entry-points."opm.lang.detect"]
ovos-lang-detect-plugin-linguonnx = "ovos_lang_detect_plugin_linguonnx:LinguONNXLangDetectPlugin"

[tool.setuptools.dynamic]
version = { attr = "ovos_lang_detect_plugin_linguonnx.version.__version__" }

[tool.setuptools.packages.find]
include = ["ovos_lang_detect_plugin_linguonnx*"]
